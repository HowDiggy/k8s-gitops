# Self-contained overlay: all resources live in this dir so Kustomize
# (run with build root infrastructure/overlays/home) does not reference paths outside it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - openebs.yaml
  - external-secrets.yaml
  - cluster-store-app.yaml
  - cnpg-operator.yaml
  - kube-prometheus-stack.yaml
  # - nvidia-device-plugin.yaml # Laptop nodes do not have NVIDIA GPUs
  # - cloudflare-talos.yaml      # Cluster is local-only (no cloudflare tunnel needed)
  - mongodb-operator.yaml
  - mongodb-cluster-app.yaml
  - qdrant.yaml
  - seaweedfs.yaml
  - spark-operator.yaml
  - cert-manager.yaml
  - cluster-issuers-app.yaml
  - gateway.yaml
  - argocd-config-app.yaml
  # - metrics-server.yaml        # K3s runs metrics-server built-in in kube-system

