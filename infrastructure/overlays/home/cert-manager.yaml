apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-cert-manager
  namespace: argocd
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: infrastructure
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.17.2
      helm:
        valueFiles:
          - $values/infrastructure/base/cert-manager/values.yaml
          - $values/infrastructure/overlays/home/cert-manager-values.yaml
    - repoURL: https://github.com/HowDiggy/k8s-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://talos-api.paulojauregui.com
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
