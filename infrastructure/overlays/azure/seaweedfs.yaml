apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: infrastructure
spec:
  project: default
  sources:
    - repoURL: https://seaweedfs.github.io/seaweedfs/helm
      chart: seaweedfs
      targetRevision: "4.22.0"
      helm:
        valueFiles:
          - $values/infrastructure/base/seaweedfs/values.yaml
          - $values/infrastructure/overlays/azure/seaweedfs-values.yaml
    - repoURL: https://github.com/HowDiggy/k8s-gitops.git
      targetRevision: feat/azure-migration
      path: infrastructure/overlays/azure/seaweedfs
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
