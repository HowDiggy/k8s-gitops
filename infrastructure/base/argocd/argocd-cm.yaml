apiVersion: v1
data:
  resource.customizations.ignoreResourceUpdates.ConfigMap: |
    jqPathExpressions:
      # Ignore the cluster-autoscaler status
      - '.metadata.annotations."cluster-autoscaler.kubernetes.io/last-updated"'
      # Ignore the annotation of the legacy Leases election
      - '.metadata.annotations."control-plane.alpha.kubernetes.io/leader"'
  resource.customizations.ignoreResourceUpdates.Endpoints: |
    jsonPointers:
      - /metadata
      - /subsets
  resource.customizations.ignoreResourceUpdates.all: |
    jsonPointers:
      - /status
  resource.customizations.ignoreResourceUpdates.apps_ReplicaSet: |
    jqPathExpressions:
      - '.metadata.annotations."deployment.kubernetes.io/desired-replicas"'
      - '.metadata.annotations."deployment.kubernetes.io/max-replicas"'
      - '.metadata.annotations."rollout.argoproj.io/desired-replicas"'
  resource.customizations.ignoreResourceUpdates.argoproj.io_Application: |
    jqPathExpressions:
      - '.metadata.annotations."notified.notifications.argoproj.io"'
      - '.metadata.annotations."argocd.argoproj.io/refresh"'
      - '.metadata.annotations."argocd.argoproj.io/hydrate"'
      - '.operation'
  resource.customizations.ignoreResourceUpdates.argoproj.io_Rollout: |
    jqPathExpressions:
      - '.metadata.annotations."notified.notifications.argoproj.io"'
  resource.customizations.ignoreResourceUpdates.autoscaling_HorizontalPodAutoscaler: |
    jqPathExpressions:
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/behavior"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/conditions"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/metrics"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/current-metrics"'
  resource.customizations.ignoreResourceUpdates.discovery.k8s.io_EndpointSlice: |
    jsonPointers:
      - /metadata
      - /endpoints
      - /ports
  resource.exclusions: |
    ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
    - apiGroups:
      - ''
      - discovery.k8s.io
      kinds:
      - Endpoints
      - EndpointSlice
    ### Internal Kubernetes resources excluded reduce the number of watched events
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    ### Intermediate Certificate Request excluded reduce the number of watched events
    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
  accounts.jaupau: login
  admin.enabled: "false"
  kustomize.buildOptions: "--enable-helm"
  resource.customizations.health.Pod: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.phase == "Pending" then
        hs.status = "Progressing"
        hs.message = "Pending"
        return hs
      end
      if obj.status.phase == "Succeeded" then
        hs.status = "Healthy"
        hs.message = "Succeeded"
        return hs
      end
      if obj.status.phase == "Failed" then
        hs.status = "Degraded"
        hs.message = "Failed"
        return hs
      end
      if obj.status.phase == "Running" then
        if obj.metadata ~= nil and obj.metadata.labels ~= nil and obj.metadata.labels["kubevirt.io/created-by"] ~= nil then
          hs.status = "Healthy"
          hs.message = "KubeVirt pod is running"
          return hs
        end
        local ready = false
        if obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              ready = true
              break
            end
          end
        end
        if ready then
          local isJob = false
          if obj.metadata ~= nil and obj.metadata.ownerReferences ~= nil then
            for i, owner in ipairs(obj.metadata.ownerReferences) do
              if owner.kind == "Job" then
                isJob = true
                break
              end
            end
          end
          if isJob then
            hs.status = "Progressing"
            hs.message = "Job is running"
          else
            hs.status = "Healthy"
            hs.message = "Pod is running and ready"
          end
          return hs
        else
          hs.status = "Progressing"
          hs.message = "Pod is not ready"
          return hs
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Progressing"
    return hs
  resource.customizations.health.kubevirt.io_VirtualMachine: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.printableStatus ~= nil then
        if obj.status.printableStatus == "Running" then
          hs.status = "Healthy"
          hs.message = "VirtualMachine is running"
          return hs
        end
        if obj.status.printableStatus == "Stopped" then
          hs.status = "Suspended"
          hs.message = "VirtualMachine is stopped"
          return hs
        end
        if obj.status.printableStatus == "Starting" or obj.status.printableStatus == "Provisioning" then
          hs.status = "Progressing"
          hs.message = "VirtualMachine is starting"
          return hs
        end
        hs.status = "Degraded"
        hs.message = "VirtualMachine is in state " .. obj.status.printableStatus
        return hs
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for VirtualMachine status"
    return hs
  resource.customizations.health.kubevirt.io_VirtualMachineInstance: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.phase == "Running" then
        hs.status = "Healthy"
        hs.message = "VMI is running"
        return hs
      end
      if obj.status.phase == "Failed" then
        hs.status = "Degraded"
        hs.message = "VMI failed"
        return hs
      end
      if obj.status.phase == "Scheduling" or obj.status.phase == "Scheduled" then
        hs.status = "Progressing"
        hs.message = "VMI is " .. obj.status.phase
        return hs
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for VMI status"
    return hs
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  name: argocd-cm
  namespace: argocd
