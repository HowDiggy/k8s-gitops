apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
  namespace: seaweedfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-backend
  target:
    name: seaweedfs-s3-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        seaweedfs_s3_config: |
          {
            "identities": [
              {
                "name": "admin",
                "credentials": [
                  {
                    "accessKey": "{{ .SEAWEEDFS_S3_ACCESS_KEY }}",
                    "secretKey": "{{ .SEAWEEDFS_S3_SECRET_KEY }}"
                  }
                ],
                "actions": [
                  "Read",
                  "Write",
                  "List",
                  "Tagging",
                  "Admin"
                ]
              }
            ]
          }
  data:
  - secretKey: SEAWEEDFS_S3_ACCESS_KEY
    remoteRef:
      key: SEAWEEDFS_S3_ACCESS_KEY
  - secretKey: SEAWEEDFS_S3_SECRET_KEY
    remoteRef:
      key: SEAWEEDFS_S3_SECRET_KEY