apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qdrant-api-key
  namespace: qdrant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-backend
  target:
    name: qdrant-api-key
    creationPolicy: Owner
  data:
  - secretKey: api-key
    remoteRef:
      key: QDRANT_API_KEY