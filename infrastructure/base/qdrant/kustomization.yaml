apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qdrant

resources:
  - 00-namespace.yaml
  - 01-external-secret.yaml

helmCharts:
  - name: qdrant
    repo: https://qdrant.to/helm
    version: 0.12.1
    releaseName: qdrant
    namespace: qdrant
    valuesFile: values.yaml