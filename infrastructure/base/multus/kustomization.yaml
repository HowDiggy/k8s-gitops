apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/master/deployments/multus-daemonset-thick.yml

patches:
  - target:
      kind: DaemonSet
      name: kube-multus-ds
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: /var/run/netns/
