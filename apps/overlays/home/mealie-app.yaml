apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-app-mealie
  namespace: argocd
  labels:
    app.kubernetes.io/name: dev-app-mealie
    app.kubernetes.io/part-of: applications
spec:
  project: default
  source:
    repoURL: https://github.com/HowDiggy/k8s-gitops.git
    targetRevision: main
    path: apps/overlays/home/mealie
  destination:
    server: https://kubernetes.default.svc
    namespace: mealie
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
