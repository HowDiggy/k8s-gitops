apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: networking-lab-workloads
  namespace: argocd
  labels:
    app.kubernetes.io/name: networking-lab-workloads
    app.kubernetes.io/part-of: applications
spec:
  project: default
  source:
    repoURL: https://github.com/HowDiggy/k8s-gitops.git
    targetRevision: main
    path: apps/base/networking-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: networking-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
