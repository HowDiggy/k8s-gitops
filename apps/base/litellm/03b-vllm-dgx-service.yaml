apiVersion: v1
kind: Service
metadata:
  name: vllm-dgx
  namespace: litellm
  labels:
    app.kubernetes.io/name: vllm-dgx
    app.kubernetes.io/component: inference
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vllm-dgx-1
  namespace: litellm
  labels:
    kubernetes.io/service-name: vllm-dgx
addressType: IPv4
ports:
  - name: http
    port: 8000
    protocol: TCP
endpoints:
  - addresses:
      - "192.168.1.42"
