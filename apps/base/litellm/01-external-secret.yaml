apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-db-credentials
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-backend
    kind: ClusterSecretStore
  target:
    name: litellm-db-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "litellm_user"
        password: "{{ .LITELLM_DB_PASSWORD }}"
  data:
    - secretKey: LITELLM_DB_PASSWORD
      remoteRef:
        key: LITELLM_DB_PASSWORD
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-backend
    kind: ClusterSecretStore
  target:
    name: litellm-secrets
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://litellm_user:{{ .LITELLM_DB_PASSWORD }}@litellm-db-rw:5432/litellm"
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        LANGFUSE_PUBLIC_KEY: "{{ .LANGFUSE_PUBLIC_KEY }}"
        LANGFUSE_SECRET_KEY: "{{ .LANGFUSE_SECRET_KEY }}"
  data:
    - secretKey: LITELLM_DB_PASSWORD
      remoteRef:
        key: LITELLM_DB_PASSWORD
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: LITELLM_MASTER_KEY
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: LANGFUSE_PUBLIC_KEY
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: LANGFUSE_SECRET_KEY
