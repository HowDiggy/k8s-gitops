apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: config
data:
  config.yaml: |
    model_list:
      - model_name: nemotron-3-super
        litellm_params:
          model: openai/nemotron-3-super
          api_base: http://vllm-dgx:8000/v1
          api_key: "none"
      - model_name: local-llm
        litellm_params:
          model: openai/nemotron-3-super
          api_base: http://vllm-dgx:8000/v1
          api_key: "none"
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY
      - model_name: claude-3-5-sonnet
        litellm_params:
          model: anthropic/claude-3-5-sonnet-20241022
          api_key: os.environ/ANTHROPIC_API_KEY

    litellm_settings:
      success_callback: ["langfuse_otel", "prometheus"]
      failure_callback: ["langfuse_otel", "prometheus"]
      telemetry: false
      cache: true
      cache_params:
        type: "redis"
        host: "litellm-valkey"
        port: 6379

    router_settings:
      routing_strategy: "usage-based-routing"
      redis_host: "litellm-valkey"
      redis_port: 6379

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
