apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-client
  namespace: networking-lab
  labels:
    kubevirt.io/vm: ubuntu-client
spec:
  runStrategy: Always
  template:
    metadata:
      annotations:
        kubevirt.io/pci-topology-version: v3
      labels:
        kubevirt.io/vm: ubuntu-client
    spec:
      architecture: amd64
      domain:
        machine:
          type: q35
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: br-lab-iface
              bridge: {}
        resources:
          requests:
            memory: 1024M
            cpu: "1"
            ephemeral-storage: "40Gi"
      networks:
        - name: br-lab-iface
          multus:
            networkName: br-lab
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu:24.04
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              password: password
              chpasswd: { expire: False }
              runcmd:
                - ip addr add 192.168.100.10/24 dev eth0
                - ip link set eth0 up
                - ip route add default via 192.168.100.1
                - echo "nameserver 8.8.8.8" > /etc/resolv.conf
