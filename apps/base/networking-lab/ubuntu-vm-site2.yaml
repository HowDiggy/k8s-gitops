apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-client-site2
  namespace: networking-lab
  labels:
    kubevirt.io/vm: ubuntu-client-site2
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: ubuntu-client-site2
    spec:
      domain:
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: br-lab-site2-iface
              bridge: {}
        resources:
          requests:
            memory: 1024M
            cpu: 1
      networks:
        - name: br-lab-site2-iface
          multus:
            networkName: br-lab-site2
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu:22.04
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              password: password
              chpasswd: { expire: False }
              runcmd:
                - ip addr add 192.168.200.10/24 dev eth0
                - ip link set eth0 up
                - ip route add default via 192.168.200.1
                - echo "nameserver 8.8.8.8" > /etc/resolv.conf
