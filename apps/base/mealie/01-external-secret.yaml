apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mealie-secrets
  namespace: mealie
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-backend
    kind: ClusterSecretStore
  target:
    name: mealie-secrets
    template:
      type: Opaque
  data:
    - secretKey: MEALIE_DB_PASSWORD
      remoteRef:
        key: MEALIE_DB_PASSWORD
    - secretKey: MEALIE_SECRET_KEY
      remoteRef:
        key: MEALIE_SECRET_KEY
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mealie-db-credentials
  namespace: mealie
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-backend
    kind: ClusterSecretStore
  target:
    name: mealie-db-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "mealie_user"
        password: "{{ .MEALIE_DB_PASSWORD }}"
  data:
    - secretKey: MEALIE_DB_PASSWORD
      remoteRef:
        key: MEALIE_DB_PASSWORD
