apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-valkey
  namespace: langfuse
  labels:
    app.kubernetes.io/name: langfuse-valkey
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-valkey
  template:
    metadata:
      labels:
        app: langfuse-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          command:
            - valkey-server
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "noeviction"
            - "--save"
            - ""
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 384Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-valkey
  namespace: langfuse
  labels:
    app.kubernetes.io/name: langfuse-valkey
spec:
  type: ClusterIP
  selector:
    app: langfuse-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
