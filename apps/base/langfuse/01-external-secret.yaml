apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-db-credentials
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-db-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "langfuse_user"
        password: "{{ .LANGFUSE_DB_PASSWORD }}"
  data:
    - secretKey: LANGFUSE_DB_PASSWORD
      remoteRef:
        key: LANGFUSE_DB_PASSWORD
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-secrets
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://langfuse_user:{{ .LANGFUSE_DB_PASSWORD }}@langfuse-db-rw:5432/langfuse"
        NEXTAUTH_SECRET: "{{ .LANGFUSE_NEXTAUTH_SECRET }}"
        SALT: "{{ .LANGFUSE_SALT }}"
        ENCRYPTION_KEY: "{{ .LANGFUSE_ENCRYPTION_KEY }}"
        CLICKHOUSE_PASSWORD: "{{ .LANGFUSE_CLICKHOUSE_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .SEAWEEDFS_S3_ACCESS_KEY }}"
        AWS_SECRET_ACCESS_KEY: "{{ .SEAWEEDFS_S3_SECRET_KEY }}"
  data:
    - secretKey: LANGFUSE_DB_PASSWORD
      remoteRef:
        key: LANGFUSE_DB_PASSWORD
    - secretKey: LANGFUSE_NEXTAUTH_SECRET
      remoteRef:
        key: LANGFUSE_NEXTAUTH_SECRET
    - secretKey: LANGFUSE_SALT
      remoteRef:
        key: LANGFUSE_SALT
    - secretKey: LANGFUSE_ENCRYPTION_KEY
      remoteRef:
        key: LANGFUSE_ENCRYPTION_KEY
    - secretKey: LANGFUSE_CLICKHOUSE_PASSWORD
      remoteRef:
        key: LANGFUSE_CLICKHOUSE_PASSWORD
    - secretKey: SEAWEEDFS_S3_ACCESS_KEY
      remoteRef:
        key: SEAWEEDFS_S3_ACCESS_KEY
    - secretKey: SEAWEEDFS_S3_SECRET_KEY
      remoteRef:
        key: SEAWEEDFS_S3_SECRET_KEY
